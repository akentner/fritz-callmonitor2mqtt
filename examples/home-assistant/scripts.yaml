# Fritz!Box Callmonitor Phone Number RPC Scripts for Home Assistant
# Add these scripts to your scripts.yaml or via the UI
# Set/Update a contact name for a phone number
fritz_set_phone_name:
  alias: "Fritz: Set Phone Name"
  description: "Associate a name with a phone number using Fritz RPC"
  icon: "mdi:phone-plus"
  mode: queued
  fields:
    phone_number:
      description: "Phone number (with country code, e.g., +49123456789)"
      example: "+49123456789"
      required: true
      selector:
        text:
          type: tel
    contact_name:
      description: "Contact name to associate with the phone number"
      example: "Max Mustermann"
      required: true
      selector:
        text:
          type: text
          multiline: false
  sequence:
    - service: mqtt.publish
      data:
        topic: "fritz/callmonitor/phone_number/request"
        qos: 1
        retain: false
        payload: >
          {




            "id": "ha-set-{{ now().timestamp() | round(6) }}",
            "method": "set",
            "phone_number": "{{ phone_number }}",
            "name": "{{ contact_name }}",
            "timestamp": "{{ now().isoformat() }}Z"
          }

    - service: persistent_notification.create
      data:
        title: "📞 Fritz Phone Number"
        message: "Setting contact: {{ phone_number }} → {{ contact_name }}"
        notification_id: "fritz_set_phone_{{ phone_number | regex_replace('[^0-9]', '') }}"
# Get contact information for a phone number
fritz_get_phone_name:
  alias: "Fritz: Get Phone Name"
  description: "Retrieve contact information for a phone number"
  icon: "mdi:phone-search"
  mode: queued
  fields:
    phone_number:
      description: "Phone number to lookup"
      example: "+49123456789"
      required: true
      selector:
        text:
          type: tel
  sequence:
    - service: mqtt.publish
      data:
        topic: "fritz/callmonitor/phone_number/request"
        qos: 1
        retain: false
        payload: >
          {




            "id": "ha-get-{{ now().timestamp() | round(6) }}",
            "method": "get",
            "phone_number": "{{ phone_number }}",
            "timestamp": "{{ now().isoformat() }}Z"
          }

    - service: persistent_notification.create
      data:
        title: "📞 Fritz Phone Lookup"
        message: "Looking up contact for: {{ phone_number }}"
        notification_id: "fritz_get_phone_{{ phone_number | regex_replace('[^0-9]', '') }}"
# Delete a contact from the database
fritz_delete_phone_name:
  alias: "Fritz: Delete Phone Name"
  description: "Remove a phone number and its associated name"
  icon: "mdi:phone-minus"
  mode: queued
  fields:
    phone_number:
      description: "Phone number to delete"
      example: "+49123456789"
      required: true
      selector:
        text:
          type: tel
    confirm_deletion:
      description: "Confirm deletion (safety check)"
      default: false
      required: true
      selector:
        boolean:
  sequence:
    - condition: template
      value_template: "{{ confirm_deletion }}"
      alias: "Confirm deletion is checked"
    - service: mqtt.publish
      data:
        topic: "fritz/callmonitor/phone_number/request"
        qos: 1
        retain: false
        payload: >
          {




            "id": "ha-delete-{{ now().timestamp() | round(6) }}",
            "method": "delete",
            "phone_number": "{{ phone_number }}",
            "timestamp": "{{ now().isoformat() }}Z"
          }

    - service: persistent_notification.create
      data:
        title: "📞 Fritz Phone Number"
        message: "Deleting contact: {{ phone_number }}"
        notification_id: "fritz_delete_phone_{{ phone_number | regex_replace('[^0-9]', '') }}"
# List all stored phone numbers
fritz_list_phone_numbers:
  alias: "Fritz: List Phone Numbers"
  description: "Retrieve all stored phone numbers and names"
  icon: "mdi:phone-log"
  mode: queued
  fields:
    limit:
      description: "Maximum number of results (1-1000)"
      default: 50
      required: false
      selector:
        number:
          min: 1
          max: 1000
          step: 1
  sequence:
    - service: mqtt.publish
      data:
        topic: "fritz/callmonitor/phone_number/request"
        qos: 1
        retain: false
        payload: >
          {




            "id": "ha-list-{{ now().timestamp() | round(6) }}",
            "method": "list",
            "limit": {{ limit | default(50) }},
            "timestamp": "{{ now().isoformat() }}Z"
          }

    - service: persistent_notification.create
      data:
        title: "📞 Fritz Phone Numbers"
        message: "Retrieving up to {{ limit | default(50) }} phone numbers..."
        notification_id: "fritz_list_phones"
# Search phone numbers by name pattern
fritz_search_phone_numbers:
  alias: "Fritz: Search Phone Numbers"
  description: "Search for phone numbers by contact name"
  icon: "mdi:phone-search-outline"
  mode: queued
  fields:
    search_pattern:
      description: "Search pattern (name or partial name)"
      example: "Max"
      required: true
      selector:
        text:
          type: text
    limit:
      description: "Maximum number of results (1-1000)"
      default: 20
      required: false
      selector:
        number:
          min: 1
          max: 1000
          step: 1
  sequence:
    - service: mqtt.publish
      data:
        topic: "fritz/callmonitor/phone_number/request"
        qos: 1
        retain: false
        payload: >
          {




            "id": "ha-search-{{ now().timestamp() | round(6) }}",
            "method": "search",
            "pattern": "{{ search_pattern }}",
            "limit": {{ limit | default(20) }},
            "timestamp": "{{ now().isoformat() }}Z"
          }

    - service: persistent_notification.create
      data:
        title: "📞 Fritz Phone Search"
        message: "Searching for contacts matching: {{ search_pattern }}"
        notification_id: "fritz_search_phones"
# Quick add from last unknown caller
fritz_add_last_unknown_caller:
  alias: "Fritz: Add Last Unknown Caller"
  description: "Quickly add the last unknown caller to contacts"
  icon: "mdi:phone-plus-outline"
  mode: queued
  fields:
    contact_name:
      description: "Name for the last unknown caller"
      required: true
      selector:
        text:
          type: text
  sequence:
    - variables:
        last_call: "{{ states.sensor.fritz_line_1_last_call.attributes }}"
        unknown_number: >
          {% if last_call.caller_name == null and last_call.caller != null %}




            {{ last_call.caller }}
          {% elif last_call.called_name == null and last_call.called != null %}




            {{ last_call.called }}
          {% else %}




            null
          {% endif %}

    - condition: template
      value_template: "{{ unknown_number != null }}"
      alias: "Check if unknown number exists"
    - service: script.fritz_set_phone_name
      data:
        phone_number: "{{ unknown_number }}"
        contact_name: "{{ contact_name }}"
    - service: persistent_notification.create
      data:
        title: "📞 Unknown Caller Added"
        message: "Added {{ unknown_number }} as {{ contact_name }}"
        notification_id: "fritz_unknown_caller_added"
# Import contacts from CSV-like format
fritz_bulk_import_contacts:
  alias: "Fritz: Bulk Import Contacts"
  description: "Import multiple contacts from text input (phone,name per line)"
  icon: "mdi:phone-import"
  mode: queued
  fields:
    contact_data:
      description: "Contact data (format: +49123456789,Max Mustermann - one per line)"
      required: true
      selector:
        text:
          type: text
          multiline: true
  sequence:
    - repeat:
        for_each: "{{ contact_data.split('\n') }}"
        sequence:
          - variables:
              line: "{{ repeat.item.strip() }}"
              parts: "{{ line.split(',') }}"
          - condition: template
            value_template: "{{ parts | length == 2 and line != '' }}"
          - service: script.fritz_set_phone_name
            data:
              phone_number: "{{ parts[0].strip() }}"
              contact_name: "{{ parts[1].strip() }}"
          - delay:
              milliseconds: 500
    - service: persistent_notification.create
      data:
        title: "📞 Bulk Import Complete"
        message: "Finished importing contacts"
        notification_id: "fritz_bulk_import"
