name: goreleaser
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  packages: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Check GORELEASER_TOKEN
        run: |
          if [ -z "${GORELEASER_TOKEN}" ]; then
            echo "GORELEASER_TOKEN is not set."
            exit 1
          else
            echo "GORELEASER_TOKEN is set."
          fi
        env:
          GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Fetch tags
        run: git fetch --force --tags
      
      - name: Verify tags
        run: |
          echo "Available tags:"
          git tag --list --sort=-version:refname | head -10
          echo "Current commit:"
          git rev-parse HEAD
          echo "Current tag (if any):"
          git describe --tags --exact-match HEAD 2>/dev/null || echo "No tag on current commit"
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            go.sum
            test/integration/go.sum

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-release-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-release-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-release-
            ${{ runner.os }}-go-
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '2.12.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
