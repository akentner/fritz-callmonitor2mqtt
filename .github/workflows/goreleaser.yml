name: goreleaser
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  packages: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Check GORELEASER_TOKEN
        run: |
          if [ -z "${GORELEASER_TOKEN}" ]; then
            echo "GORELEASER_TOKEN is not set."
            exit 1
          else
            echo "GORELEASER_TOKEN is set."
          fi
        env:
          GORELEASER_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Ensure tags are available
        run: |
          # Refresh all refs to make sure we have the latest tags
          git fetch origin --tags --force

          echo "=== Debug Information ==="
          echo "Current HEAD commit:"
          git rev-parse HEAD

          echo "All available tags:"
          git tag -l --sort=-version:refname | head -10

          echo "Tags pointing to current commit:"
          git tag --points-at HEAD

          echo "Trying to describe current commit:"
          git describe --tags HEAD || echo "Could not describe HEAD with tags"

          echo "Git status:"
          git status --porcelain

          echo "=== End Debug Information ==="
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            go.sum
            test/integration/go.sum
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-release-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-release-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-release-
            ${{ runner.os }}-go-
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '2.12.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN || secrets.GITHUB_TOKEN }}
